name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vcontrolhub_ci
      RUN_DATABASE_INTEGRATION_TESTS: "1"
      NODE_ENV: test
      NEXT_TELEMETRY_DISABLED: 1
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vcontrolhub_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d vcontrolhub_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify toolchain security regression
        run: npm run toolchain:security

      - name: Verify high-severity dependency audit
        run: npm run audit:high

      - name: Generate Prisma client
        run: npx prisma generate

      # The migration chain is hand-written and only exercised by
      # `prisma migrate deploy` (docker-entrypoint, deploy.sh, install.sh) —
      # every other CI schema step uses `db push`, which never replays the
      # migrations. A migration that fails on a clean database therefore
      # passed CI green and then broke every deployment. Apply the full chain
      # to a scratch database so that class of break fails here.
      - name: Verify migration chain applies to a fresh database
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vcontrolhub_migrate
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d vcontrolhub_ci -v ON_ERROR_STOP=1 -c 'CREATE DATABASE vcontrolhub_migrate;'
          npx prisma migrate deploy

      # Schema-vs-migrations drift guard. A schema.prisma edit without a
      # matching migration previously only surfaced at `migrate deploy` time
      # (the September incident needed a hand-written reconciliation
      # migration). Gate on structural drift — added/removed tables, columns,
      # enums, indexes. Constraint-name renames (Prisma 7 default names vs
      # the historical migrations' names) and FK-constraint presence are
      # filtered: they are semantic no-ops for migrate deploy today and would
      # make this gate fire on every unrelated PR.
      - name: Fail on schema/migration drift
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vcontrolhub_migrate
          SHADOW_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vcontrolhub_migrate_shadow
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d vcontrolhub_ci -v ON_ERROR_STOP=1 -c 'CREATE DATABASE vcontrolhub_migrate_shadow;'
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema prisma/schema.prisma \
            > drift-report.txt
          # Keep only structural change lines for the gate.
          grep -E '^\s*\[(\*|\+|-)\]' drift-report.txt \
            | grep -v '^\s*\[\*\] Changed the' \
            | grep -Ev 'Renamed the primary key|Renamed index|Renamed the foreign key|Renamed the unique|foreign key on columns' \
            > drift-gate.txt || true
          if [ -s drift-gate.txt ]; then
            echo '::error::schema.prisma and prisma/migrations have drifted. Add a migration (npx prisma migrate dev) or revert the schema change.'
            cat drift-gate.txt
            exit 1
          fi
          echo 'No structural drift between schema and migrations.'

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: API copy audit
        run: npm run api-copy:audit

      # Push the schema before the suite: the database integration tests
      # (files/job/upload/downloads/server inventory) run against this
      # isolated loopback database and need real tables to exist.
      - name: Apply database schema
        run: npx prisma db push --accept-data-loss

      # Fail fast with a clear message if someone adds a Prisma mock that
      # returns Promise instead of PrismaPromise — this was the long-running
      # red CI cause (move-file-action.test.ts). Keep typecheck above tests.
      - name: Test with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore

      - name: Build
        run: npm run build

      - name: Build runtime bundle
        run: npm run build:runtime

  # Windows compatibility gate: the same unit/type/lint/build chain on
  # windows-latest so cross-platform regressions (path handling, native
  # spawns, shell-only scripts) fail PRs instead of only Windows users.
  # No PostgreSQL service here — GitHub service containers do not run on
  # Windows runners; the DB integration tests gate on
  # RUN_DATABASE_INTEGRATION_TESTS and skip, the rest of the suite is mocked.
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vcontrolhub_ci
      NODE_ENV: test
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      # Keep the working tree byte-identical to the Linux job: the default
      # autocrlf=true checkout rewrites sources to CRLF and can skew
      # source-scanning scripts and tests that assume LF.
      - name: Disable autocrlf (LF working tree)
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Build runtime bundle
        run: npm run build:runtime

  e2e-public-cross-browser:
    name: E2E public smoke (Chromium + Firefox + WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: test
    env:
      NEXT_TELEMETRY_DISABLED: 1
      PLAYWRIGHT_CROSS_BROWSER: "1"
      PLAYWRIGHT_SKIP_WEB_SERVER: "1"
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      # Do NOT set NODE_ENV=production at job scope: npm ci would omit
      # devDependencies (@tailwindcss/postcss) and next build fails.
      NEXT_HOST: 127.0.0.1
      PORT: "3000"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vcontrolhub_ci
      AUTH_SECRET: ci-e2e-auth-secret-at-least-32-bytes-long
      AUTH_SESSION_SECRET: ci-e2e-session-secret-at-least-32-bytes
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      ADMIN_INITIAL_PASSWORD: ci-e2e-admin-initial-password
      APP_SLUG: vcontrolhub
      AUTH_SESSION_COOKIE_NAME: vcontrolhub_session
      STORAGE_ROOT: /tmp/vcontrolhub-e2e-storage
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vcontrolhub_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d vcontrolhub_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('next.config.*') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-next-

      - name: Apply database schema
        run: npx prisma db push --accept-data-loss

      - name: Seed admin roles (for authenticated smoke)
        run: npx tsx prisma/seed.ts

      # Build in this job (same runner as the server) so .next is never
      # transferred across jobs. Local rebuild + .next/cache is cheaper and
      # more reliable than cross-job .next artifacts (see docs/ci-gates.md).
      - name: Build app + runtime
        run: |
          npm run build
          npm run build:runtime

      - name: Start production custom server
        env:
          NODE_ENV: production
        run: |
          set -euo pipefail
          nohup node dist/server.js > /tmp/vch-e2e-server.log 2>&1 &
          echo $! > /tmp/vch-e2e-server.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/login >/dev/null 2>&1; then
              echo "server ready (pid=$(cat /tmp/vch-e2e-server.pid))"
              # Keep the step alive only long enough to confirm readiness.
              # Server continues via nohup for subsequent steps.
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/vch-e2e-server.pid)" 2>/dev/null; then
              echo "server process exited early"
              cat /tmp/vch-e2e-server.log || true
              exit 1
            fi
            sleep 2
          done
          echo "server failed to become ready"
          cat /tmp/vch-e2e-server.log || true
          exit 1

      - name: Run public smoke across browsers
        env:
          NODE_ENV: production
        run: |
          set -euo pipefail
          # Confirm server still up before Playwright starts.
          curl -fsS http://127.0.0.1:3000/login >/dev/null
          npx playwright test e2e/public-smoke.spec.ts \
            --project=chromium --project=firefox --project=webkit \
            --workers=1 --retries=1

      # Uses isolated admin + direct session minting so seed PENDING_PASSWORD_RESET
      # does not block navigation. Keep this cross-browser: protected routes load
      # client modules and CSP paths that the public smoke cannot exercise.
      - name: Run authenticated smoke across browsers
        env:
          NODE_ENV: production
          E2E_DIRECT_SESSION: "1"
          E2E_TRUST_LOCAL_DB_SESSION: "1"
          E2E_ISOLATED_ACCOUNT: "1"
          E2E_USER: vcontrolhub_e2e
          E2E_PASS: VControlHub-E2E-2026!
          E2E_DIRECT_USER: vcontrolhub_e2e
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:3000/login >/dev/null
          npx playwright test e2e/authenticated-flow.spec.ts \
            --project=chromium --project=firefox --project=webkit \
            --workers=1 --retries=1

      - name: Run complete product workflows on Chromium
        env:
          NODE_ENV: production
          E2E_DIRECT_SESSION: "1"
          E2E_TRUST_LOCAL_DB_SESSION: "1"
          E2E_ISOLATED_ACCOUNT: "1"
          E2E_USER: vcontrolhub_e2e
          E2E_PASS: VControlHub-E2E-2026!
          E2E_DIRECT_USER: vcontrolhub_e2e
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:3000/login >/dev/null
          npm run test:e2e:workflows -- --retries=1

      - name: Verify shared UI components
        run: |
          npm run ui:showcase -- .playwright-output/components
          npm run ui:check -- .playwright-output/components

      - name: Run whole-site UI and populated AI checks across browsers
        env:
          NODE_ENV: production
          E2E_DIRECT_SESSION: "1"
          E2E_TRUST_LOCAL_DB_SESSION: "1"
          E2E_ISOLATED_ACCOUNT: "1"
          E2E_USER: vcontrolhub_e2e
          E2E_PASS: VControlHub-E2E-2026!
          E2E_DIRECT_USER: vcontrolhub_e2e
          PLAYWRIGHT_OUTPUT_DIR: .playwright-output/site-ui
        run: |
          npx playwright test e2e/ui-site.spec.ts e2e/ui-workspace.spec.ts \
            --project=chromium --project=firefox --project=webkit \
            --workers=2 --retries=1

      - name: Run exhaustive Chromium UI matrix nightly or on demand
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          NODE_ENV: production
          UI_FULL_MATRIX: "1"
          E2E_DIRECT_SESSION: "1"
          E2E_TRUST_LOCAL_DB_SESSION: "1"
          E2E_ISOLATED_ACCOUNT: "1"
          E2E_USER: vcontrolhub_e2e
          E2E_PASS: VControlHub-E2E-2026!
          E2E_DIRECT_USER: vcontrolhub_e2e
          PLAYWRIGHT_OUTPUT_DIR: .playwright-output/full-site-ui
        run: npx playwright test e2e/ui-site.spec.ts --project=chromium --workers=2 --retries=1

      - name: Dump server log on failure
        if: failure()
        run: |
          echo "--- server pid ---"
          cat /tmp/vch-e2e-server.pid || true
          echo "--- server log ---"
          cat /tmp/vch-e2e-server.log || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-public-cross-browser
          path: |
            .playwright-output/
            playwright-report/
            /tmp/vch-e2e-server.log
          if-no-files-found: ignore

  dast-baseline:
    name: DAST baseline (optional surface probe)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      NEXT_TELEMETRY_DISABLED: 1
      BASE_URL: http://127.0.0.1:3000
      # NODE_ENV only on server start — npm ci must install devDependencies.
      NEXT_HOST: 127.0.0.1
      PORT: "3000"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vcontrolhub_ci
      AUTH_SECRET: ci-dast-auth-secret-at-least-32-bytes-long
      AUTH_SESSION_SECRET: ci-dast-session-secret-at-least-32-bytes
      ENCRYPTION_KEY: fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210
      ADMIN_INITIAL_PASSWORD: ci-dast-admin-initial-password
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vcontrolhub_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d vcontrolhub_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('next.config.*') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-next-

      - name: Apply database schema
        run: npx prisma db push --accept-data-loss

      - name: Build app + runtime
        run: |
          npm run build
          npm run build:runtime

      - name: Start production custom server
        env:
          NODE_ENV: production
        run: |
          set -euo pipefail
          nohup node dist/server.js > /tmp/vch-dast-server.log 2>&1 &
          echo $! > /tmp/vch-dast-server.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/login >/dev/null 2>&1; then
              echo "server ready (pid=$(cat /tmp/vch-dast-server.pid))"
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/vch-dast-server.pid)" 2>/dev/null; then
              echo "server process exited early"
              cat /tmp/vch-dast-server.log || true
              exit 1
            fi
            sleep 2
          done
          echo "server failed to become ready"
          cat /tmp/vch-dast-server.log || true
          exit 1

      - name: Run DAST baseline probe
        env:
          NODE_ENV: production
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:3000/login >/dev/null
          npm run dast:baseline

      - name: Dump server log on failure
        if: failure()
        run: cat /tmp/vch-dast-server.log || true

      - name: Upload DAST output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dast-baseline
          path: |
            .dast-output/
            /tmp/vch-dast-server.log
          if-no-files-found: ignore

  # Turbopack build probe (non-blocking). Production builds run webpack
  # (`npm run build`); this job keeps `build:turbopack` continuously verified
  # so the switch can happen the day Turbopack is declared stable, instead of
  # discovering a quarter's worth of incompatibilities at once.
  turbopack-smoke:
    name: Turbopack build probe (non-blocking)
    runs-on: ubuntu-24.04
    continue-on-error: true
    env:
      # prisma.config.ts requires DATABASE_URL to load even when nothing
      # connects (prisma generate / next build config chain).
      DATABASE_URL: postgresql://probe:probe@127.0.0.1:1/probe
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build with Turbopack
        run: npm run build:turbopack
