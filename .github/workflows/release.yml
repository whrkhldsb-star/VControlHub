name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vcontrolhub_release
      NODE_ENV: test
      NEXT_TELEMETRY_DISABLED: 1
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vcontrolhub_release
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d vcontrolhub_release"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag and project
        run: |
          npm run version:check -- "$GITHUB_REF_NAME"
          npm run verify

      - name: Build versioned source package
        run: |
          npm run release:package
          (cd dist && sha256sum "vcontrolhub-${GITHUB_REF_NAME}.tar.gz" > "vcontrolhub-${GITHUB_REF_NAME}.tar.gz.sha256")

      - name: Set up Go for the native file Agent
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
          cache: false

      - name: Build native file Agents
        working-directory: agent-files
        run: |
          for os in linux windows; do
            for arch in amd64 arm64; do
              filename="vch-files-$os-$arch"
              if [ "$os" = windows ]; then filename="$filename.exe"; fi
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -o "../dist/$filename" .
            done
          done
          (cd ../dist && sha256sum vch-files-* > agent-files.sha256)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "dist/vcontrolhub-${GITHUB_REF_NAME}.tar.gz"
          "dist/vcontrolhub-${GITHUB_REF_NAME}.tar.gz.sha256"
          dist/vch-files-* dist/agent-files.sha256
          --verify-tag
          --title "VControlHub $GITHUB_REF_NAME"
          --generate-notes
